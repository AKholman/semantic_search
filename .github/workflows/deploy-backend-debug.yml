name: Debug Deploy Backend Only (Manual)

# 1. Manual Trigger: Allows you to run this from the GitHub Actions UI
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      # Also trigger on changes to the backend directory or key files
      - backend/**
      - requirements.txt

env:
  # This MUST match the space name for your Docker backend
  HF_SPACE_NAME: nlp-semantic-search-backend

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. DEBUG STEP: List files before cloning to confirm existence

      - name: 'DEBUG: Verify local source files exist'
        run: |
          echo "--- Listing contents of the 'backend/' directory in the runner: ---"
          ls -al backend/

      - name: Clone HF backend Space (authenticated)
        run: |
          TARGET="${{ env.HF_SPACE_NAME }}"
          git clone https://:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/Alex-Khol/${TARGET}

      # 3. DEBUG SYNC: Use explicit cp and robust rsync for all necessary files

      - name: Sync Backend Files (Simplified and Fixed)
        run: |
          SPACE_DIR="${{ env.HF_SPACE_NAME }}"
          
          rsync -av --delete \
            --exclude '.git' \
            --exclude 'README.md' \
            --exclude 'embeddings/answers.npy' \
            --exclude 'embeddings/faiss_index.index' \
            --exclude 'embeddings/' \ # <--- ADD THIS LINE
            ./backend/ "${SPACE_DIR}/"

      - name: 'DEBUG: Verify files exist in cloned Space'
        run: |
          ls -al ${{ env.HF_SPACE_NAME }}/

      # 4. ROBUST COMMIT: Use the reliable Git commit logic
      - name: Commit and push to HF (Robust Check)
        run: |
          cd ${{ env.HF_SPACE_NAME }}
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          
          # Add all files copied in the previous step
          git add .
          
          # If diff finds any staged changes, commit them and push.
          if git diff --staged --quiet; then
              echo "No meaningful changes detected to commit."
          else
              git commit -m "Deploy FastAPI backend (Debug Run)"
              git push
              echo "Successfully committed and pushed changes."
          fi