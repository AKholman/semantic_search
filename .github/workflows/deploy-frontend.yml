name: Deploy Frontend to HF Gradio Space

on:
  push:
    branches: [ main ]
    paths:
      # 1. Primary trigger for frontend code changes
      - frontend/**
      
      # 2. Add global configuration files that might affect the frontend
      # (e.g., if you use requirements.txt in the frontend Space)
      - requirements.txt
      - frontend/frontend_requirements.txt # Assuming this is used locally

      # 3. CRITICAL ADDITION: Triggers the workflow if the workflow file itself changes,
      # or if the backend workflow file changes (ensures both appear in the Actions list).
      - '.github/workflows/**'

env:
  # This must match your actual Hugging Face Space repository name
  HF_SPACE_NAME: nlp-semantic-search-frontend

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Clone HF frontend Space (authenticated)
        # CRITICAL FIX: Use the correct variable HF_SPACE_NAME and embed the token
        run: |
          git clone https://:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/Alex-Khol/${{ env.HF_SPACE_NAME }}


      - name: Sync frontend to HF Space
        run: |
          # 1. Clean the target folder (Hugging Face Space clone) first to guarantee fresh copy
          # This step is often overkill, but guarantees we aren't dealing with stale files.
          # We skip this for now, but focus on the rsync path.

          # Sync all contents of the local frontend/ folder into the root of the cloned Space
          # CRITICAL CHANGE: Using './frontend/' ensures the path is explicit from the root of the checkout.
          rsync -av --delete \
            --exclude '.git' \
            ./frontend/ ${{ env.HF_SPACE_NAME }}/

      - name: Commit and push to HF
        run: |
          cd ${{ env.HF_SPACE_NAME }}
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git diff --quiet || git commit -m "Deploy Gradio frontend"
          git push