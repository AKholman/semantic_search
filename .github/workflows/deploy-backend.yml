name: Deploy Backend to HF Docker Space

on:
  push:
    branches: [ main ]
    paths:
      # CRITICAL ADDITION: Triggers the workflow if the workflow file itself changes 
      # (ensures it appears in the Actions list alongside the frontend).
      - '.github/workflows/**' 
      
      # Primary triggers for backend code changes
      - backend/**
      - requirements.txt

env:
  # This must match your actual Hugging Face Space repository name
  HF_SPACE_NAME: nlp-semantic-search-backend

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Clone HF backend Space (authenticated)
        # CRITICAL FIX: Embeds the token in the URL for reliable authentication
        run: |
          TARGET="${{ env.HF_SPACE_NAME }}"
          git clone https://:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/Alex-Khol/${TARGET}

      - name: Sync backend + root requirements to HF Space
        run: |
          # 1. Sync the backend code (app_core.py, etc.) into the cloned folder's root
          rsync -av --delete \
            --exclude '.git' \
            backend/ ${{ env.HF_SPACE_NAME }}/

          # 2. Copy the top-level requirements.txt into the cloned folder's root
          # This is required for the Docker build to find it (COPY requirements.txt .)
          cp requirements.txt ${{ env.HF_SPACE_NAME }}/requirements.txt
          
          # 3. Assuming your Dockerfile is in the root of your project, copy it to the Space's root:
          cp Dockerfile ${{ env.HF_SPACE_NAME }}/Dockerfile

      - name: Commit and push to HF
        run: |
          cd ${{ env.HF_SPACE_NAME }}
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git diff --quiet || git commit -m "Deploy FastAPI backend (Docker)"
          git push